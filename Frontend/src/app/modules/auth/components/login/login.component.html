<div class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-green-700">FarmConnect</h1>
      <p class="text-gray-600 mt-2">AI-Powered Farming Platform</p>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-6">Sign In</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500"
          placeholder="you@example.com"
          [class.border-red-500]="submitted && f['email'].invalid"
        />
        <div *ngIf="submitted && f['email'].errors" class="text-red-500 text-sm mt-1">
          <p *ngIf="f['email'].errors['required']">Email is required</p>
          <p *ngIf="f['email'].errors['email']">Email is invalid</p>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500"
          placeholder="••••••••"
          [class.border-red-500]="submitted && f['password'].invalid"
        />
        <div *ngIf="submitted && f['password'].errors" class="text-red-500 text-sm mt-1">
          <p *ngIf="f['password'].errors['required']">Password is required</p>
          <p *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</p>
        </div>
      </div>

      <!-- Error Alert -->
      <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 disabled:opacity-50"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>
    </form>

    <!-- Register Link -->
    <p class="text-center text-gray-600 mt-4">
      Don't have an account?
      <a routerLink="/auth/register" class="text-green-600 hover:text-green-700 font-bold">
        Register here
      </a>
    </p>
  </div>
</div>
